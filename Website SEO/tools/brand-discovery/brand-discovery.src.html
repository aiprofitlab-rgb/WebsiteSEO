<!--
  Brand Discovery questionnaire - the SOURCE of /en/brand-discovery/ and
  /ar/brand-discovery/. Do not edit the two published files; edit this one and run

      python3 tools/brand-discovery/build_brand_discovery.py

  The builder wraps it in the site's real <head> (tools/v4/kit.py head_html) and
  fills the {{...}} placeholders per language. The first style element becomes
  the page CSS; everything after it is the body. (Never write the literal tag
  in this comment - the builder finds the CSS by searching for it.)

  Started life as a claude.ai artifact. The claude.ai-only parts (window.claude
  db/user/assets/downloads, the owner "Responses" sheet) are gone; submissions go
  to the Apps Script in tools/brand-discovery/brand-discovery-apps-script.gs.
-->
<style>
/* Layout: a quiet two-column brief — a sticky step rail on the left, one question set at a time on the right; the rail folds into a progress bar on phones. */
:root{
  /* AI Profit Lab brand constants (tokens.css, verbatim) */
  --teal-950:#072B22; --teal-900:#0A3D30; --teal:#0F6E56; --teal-600:#158268;
  --amber:#BA7517; --amber-bright:#D89234; --amber-pale:#E8C98F; --amber-text:#8F5A11;
  --cream:#F1EFE8; --panel:#FAF8F2; --panel-2:#EAE4D5; --ink:#232B26; --muted:#5A665D; --line:#DED8C8;
  --wa:#1FAF5E; --alert:#A6431F;
  --display:'Marcellus',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display-ar:'Markazi Text','Noto Naskh Arabic','Geeza Pro',serif;
  --sans-ar:'IBM Plex Sans Arabic','Geeza Pro','Segoe UI',Tahoma,sans-serif;
  --ease:cubic-bezier(.22,.7,.25,1);
  --r-card:16px; --r-inset:14px; --r-pill:99px;
  --shadow-card:0 26px 50px -34px rgba(7,43,34,.55);
  /* semantic roles: light */
  --bg:var(--cream); --surface:var(--panel); --surface-2:var(--panel-2);
  --text:var(--ink); --text-muted:var(--muted); --heading:var(--teal-950); --border:var(--line);
  --brand:var(--teal); --brand-hover:var(--teal-600); --brand-soft:rgba(15,110,86,.09); --on-brand:#FFFFFF;
  --accent:var(--amber); --accent-text:var(--amber-text); --error:var(--alert);
  --field:#FFFFFF; --ghost-border:rgba(35,43,38,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1613; --surface:#11201B; --surface-2:#16261F;
    --text:#EDE8DC; --text-muted:#A6B2A9; --heading:#EDE8DC; --border:#24382F;
    --brand:#3FAE8A; --brand-hover:#52BE99; --brand-soft:rgba(63,174,138,.12); --on-brand:#0A1613;
    --accent:#D89234; --accent-text:#EBAB53; --error:#E07A55;
    --field:#0E1C17; --ghost-border:rgba(237,232,220,.24);
    --shadow-card:0 20px 50px -30px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1613; --surface:#11201B; --surface-2:#16261F;
  --text:#EDE8DC; --text-muted:#A6B2A9; --heading:#EDE8DC; --border:#24382F;
  --brand:#3FAE8A; --brand-hover:#52BE99; --brand-soft:rgba(63,174,138,.12); --on-brand:#0A1613;
  --accent:#D89234; --accent-text:#EBAB53; --error:#E07A55;
  --field:#0E1C17; --ghost-border:rgba(237,232,220,.24);
  --shadow-card:0 20px 50px -30px rgba(0,0,0,.6);
  color-scheme:dark;
}

html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:1.03rem;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:lang(ar) body,body:lang(ar){font-family:var(--sans-ar)}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--heading);margin:0;text-wrap:balance;letter-spacing:-.005em}
:lang(ar) h1,:lang(ar) h2,:lang(ar) h3{font-family:var(--display-ar);font-weight:500;letter-spacing:0}
a{color:var(--brand);text-underline-offset:3px}
::selection{background:var(--amber-pale);color:var(--teal-950)}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
button{font:inherit;color:inherit}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:.78rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:.6em}
.eyebrow .ast{color:var(--accent);letter-spacing:0;font-size:1rem}
:lang(ar) .eyebrow{font-family:var(--sans-ar);letter-spacing:0;font-size:.9rem}

/* ---- header ---- */
.top{padding-block:22px 10px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.home{display:block;line-height:0}
.logo{display:block;height:26px;width:auto}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}
:root[data-theme="dark"] .logo-dark{display:block}
.top-actions{display:flex;gap:10px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-pill);padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:6px 14px;border-radius:var(--r-pill);cursor:pointer;font-size:.85rem;color:var(--text-muted)}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.lang button:lang(ar),.lang [lang="ar"]{font-family:var(--sans-ar)}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(28px,5vw,72px);padding-block:clamp(20px,4vw,48px) 80px}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}}

.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail button{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;background:transparent;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--text-muted);font-size:.95rem;transition:background .2s var(--ease),color .2s var(--ease)}
.rail button:hover{background:var(--surface-2);color:var(--text)}
.rail .n{font-family:var(--mono);font-size:.74rem;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);flex:none;font-variant-numeric:tabular-nums}
.rail li.done .n{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.rail li.current button{color:var(--heading);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.rail li.current .n{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.rail .meta{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:.85rem;color:var(--text-muted);line-height:1.55}
@media (max-width:860px){.rail{display:none}}

.mbar{display:none}
@media (max-width:860px){
  .mbar{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 12px;margin-bottom:6px;border-bottom:1px solid var(--border)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
}
.mbar .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.88rem;color:var(--text-muted)}
.mbar .row b{color:var(--heading);font-weight:500}
.track{height:3px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;background:var(--brand);transform-origin:left center;transform:scaleX(0)}
:root[dir="rtl"] .track i{transform-origin:right center}

/* ---- step ---- */
main{min-width:0;max-width:760px}
.step-head{display:grid;gap:14px;margin-bottom:34px}
.step-head h1{font-size:clamp(2.1rem,4.6vw,3.3rem);line-height:1.06}
.step-head h1 .wipe{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.step-head h1 .wipe>span{display:block}
.lede{font-size:clamp(1.02rem,1.5vw,1.15rem);color:var(--text-muted);max-width:60ch;margin:0}
.fields{display:grid;gap:30px}
.q{display:grid;gap:10px;min-width:0}
.q>label,.q>.lbl{font-weight:500;color:var(--heading);font-size:1.02rem;line-height:1.4;text-wrap:pretty}
.q .req{color:var(--accent-text);font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-inline-start:8px;font-weight:500;vertical-align:2px}
:lang(ar) .q .req{font-family:var(--sans-ar);letter-spacing:0;font-size:.8rem}
.hint{font-size:.88rem;color:var(--text-muted);margin-top:-4px;max-width:62ch}
.err{display:none;font-size:.86rem;color:var(--error)}
.q.invalid .err{display:block}
.q.invalid input,.q.invalid textarea{border-color:var(--error)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
@media (max-width:560px){.pair{grid-template-columns:minmax(0,1fr)}}

input[type=text],input[type=email],input[type=tel],input[type=url],textarea{
  width:100%;box-sizing:border-box;font:inherit;font-size:1rem;color:var(--text);background:var(--field);
  border:1px solid var(--border);border-radius:12px;padding:13px 15px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
textarea{min-height:108px;resize:vertical;line-height:1.55}
textarea.short{min-height:76px}
input::placeholder,textarea::placeholder{color:var(--text-muted);opacity:1}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
[dir="ltr"].ltr-field{text-align:left}

/* radios as rows */
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .2s var(--ease),background .2s var(--ease),transform .12s var(--ease)}
.opt:active{transform:scale(.99)}
.opt input{margin:4px 0 0;accent-color:var(--brand);flex:none}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);cursor:pointer;font-size:.92rem;transition:border-color .2s var(--ease),background .2s var(--ease),transform .12s var(--ease);user-select:none}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--heading)}
.chip[aria-pressed="true"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.chip .sw{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chip.has-sw[aria-pressed="true"]::before{display:none}
.chip.has-sw[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--brand)}

/* card grids (archetypes, logo types, typefaces) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{position:relative;display:grid;gap:8px;align-content:start;text-align:start;padding:16px;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);cursor:pointer;transition:border-color .2s var(--ease),box-shadow .25s var(--ease),transform .12s var(--ease)}
.card:hover{box-shadow:var(--shadow-card)}
.card:active{transform:scale(.985)}
.card[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.card .tick{position:absolute;top:12px;inset-inline-end:12px;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;background:var(--field)}
.card[aria-pressed="true"] .tick{background:var(--brand);border-color:var(--brand)}
.card .tick svg{width:12px;height:12px;stroke:var(--on-brand);fill:none;stroke-width:3;opacity:0}
.card[aria-pressed="true"] .tick svg{opacity:1}
.card .ico{width:34px;height:34px;color:var(--brand)}
.card .ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:1.25rem;line-height:1.15}
.card p{margin:0;font-size:.88rem;color:var(--text-muted);line-height:1.5}
.card .eg{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;color:var(--text-muted)}
:lang(ar) .card .eg{font-family:var(--sans-ar);font-size:.8rem;letter-spacing:0}
.card.vis{padding:0;overflow:hidden;gap:0}
.card.vis .art{height:96px;display:grid;place-items:center;background:var(--surface-2);color:var(--heading);border-bottom:1px solid var(--border)}
.card.vis .art svg{height:62px;width:auto;max-width:90%;direction:ltr}
.ttbtn .viz svg{direction:ltr}
.card.vis .cap{padding:12px 14px 14px;display:grid;gap:2px}
.card.vis .cap b{font-weight:500;color:var(--heading);font-size:.95rem}
.card.vis .cap span{font-size:.82rem;color:var(--text-muted)}
.card.vis .tick{top:10px}
.type-aa{font-size:2.6rem;line-height:1;color:var(--heading)}
.cnt{font-family:var(--mono);font-size:.78rem;color:var(--text-muted)}
:lang(ar) .cnt{font-family:var(--sans-ar)}

/* sliders */
.sliders{display:grid;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:8px 18px}
.sl{display:grid;gap:4px;padding-block:12px;border-bottom:1px solid var(--border)}
.sl:last-child{border-bottom:0}
.sl .ends{display:flex;justify-content:space-between;gap:12px;font-size:.9rem;color:var(--text-muted)}
.sl .ends span.on{color:var(--heading);font-weight:500}
input[type=range]{width:100%;accent-color:var(--brand);margin:6px 0 0;height:24px;cursor:pointer}

/* this-or-that */
.tt{display:grid;gap:14px}
.ttrow{display:grid;gap:8px}
.ttrow .pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ttbtn{display:grid;gap:0;padding:0;border:1px solid var(--border);border-radius:var(--r-inset);background:var(--surface);cursor:pointer;overflow:hidden;text-align:center;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),transform .12s var(--ease)}
.ttbtn:active{transform:scale(.985)}
.ttbtn[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.ttbtn .viz{height:92px;display:block;width:100%}
.ttbtn .viz svg{display:block;width:100%;height:100%}
.ttbtn span.l{display:block;padding:9px 8px;font-size:.88rem;color:var(--text)}
.ttbtn[aria-pressed="true"] span.l{color:var(--heading);font-weight:500}
.ttrow .either{justify-self:center;border:0;background:none;color:var(--text-muted);font-size:.82rem;cursor:pointer;padding:2px 8px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.ttrow .either[aria-pressed="true"]{color:var(--brand);text-decoration-color:var(--brand)}

/* competitors */
.comp{display:grid;gap:10px}
.comp .r{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.comp .r .k{font-family:var(--mono);font-size:.8rem;color:var(--text-muted);text-align:center}
@media (max-width:560px){.comp .r{grid-template-columns:22px minmax(0,1fr)}.comp .r input:last-child{grid-column:2}}

/* upload */
.up{display:grid;gap:10px;padding:14px;border:1px dashed var(--border);border-radius:var(--r-inset);background:var(--surface)}
.up .files{display:flex;flex-wrap:wrap;gap:8px}
.up .file{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border:1px solid var(--border);border-radius:10px;background:var(--field);font-size:.84rem;max-width:100%}
.up .file img{width:34px;height:34px;object-fit:cover;border-radius:6px;background:var(--surface-2)}
.up .file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.up .file button{border:0;background:none;cursor:pointer;color:var(--text-muted);font-size:1rem;line-height:1;padding:2px 4px}
.up .file .sz{font-family:var(--mono);font-size:.74rem;color:var(--text-muted);max-width:none;overflow:visible}
.up .note{font-size:.84rem;color:var(--text-muted)}
.up-btn:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:3px}
.up .ferr{font-size:.86rem;color:var(--error)}
.up .ferr:empty{display:none}

/* buttons */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:44px;padding-top:24px;border-top:1px solid var(--border);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:var(--r-pill);padding:14px 26px;font-family:var(--sans);font-weight:500;font-size:1rem;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:background .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease)}
:lang(ar) .btn{font-family:var(--sans-ar)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:transparent;border-color:var(--ghost-border);color:var(--text)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .arr{display:inline-block;transition:transform .2s var(--ease)}
.btn:hover .arr{transform:translateX(3px)}
:root[dir="rtl"] .btn .arr{transform:scaleX(-1)}
:root[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(3px)}
/* Back points against the reading direction: ← in English, → in Arabic. */
.btn .arr.back{transform:scaleX(-1)}
.btn:hover .arr.back{transform:scaleX(-1) translateX(3px)}
:root[dir="rtl"] .btn .arr.back{transform:none}
:root[dir="rtl"] .btn:hover .arr.back{transform:translateX(3px)}
.saved{font-size:.82rem;color:var(--text-muted);font-family:var(--mono)}
:lang(ar) .saved{font-family:var(--sans-ar)}

/* welcome */
.welcome-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;border-top:1px solid var(--border)}
@media (max-width:560px){.welcome-list{grid-template-columns:minmax(0,1fr)}}
.welcome-list li{display:flex;gap:14px;align-items:baseline;padding-block:14px;border-bottom:1px solid var(--border)}
.welcome-list .n{font-family:var(--mono);font-size:.8rem;color:var(--accent-text);font-variant-numeric:tabular-nums}
.welcome-list b{font-weight:500;color:var(--heading);display:block}
.welcome-list span{font-size:.88rem;color:var(--text-muted)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);color:var(--text-muted)}
:lang(ar) .facts span{font-family:var(--sans-ar);text-transform:none;letter-spacing:0;font-size:.85rem}
.ar-note{font-size:.84rem;color:var(--text-muted);padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}

/* review */
.rev{display:grid;gap:22px}
.rev section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:clamp(18px,3vw,26px)}
.rev section header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.rev h2{font-size:1.4rem}
.rev .edit{font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;background:none;border:0;color:var(--brand);cursor:pointer;padding:4px 0}
:lang(ar) .rev .edit{font-family:var(--sans-ar);letter-spacing:0;font-size:.88rem;text-transform:none}
.rev dl{margin:0;display:grid;gap:0}
.rev dl>div{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px;padding-block:10px;border-top:1px solid var(--border)}
@media (max-width:560px){.rev dl>div{grid-template-columns:minmax(0,1fr);gap:2px}}
.rev dt{font-size:.86rem;color:var(--text-muted)}
.rev dd{margin:0;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.rev dd.empty{color:var(--text-muted)}
.rev dd.miss{color:var(--error)}

/* done */
.done-box{display:grid;gap:18px;padding:clamp(22px,4vw,34px);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
.contact{display:grid;gap:8px;font-size:.98rem}
.contact div{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.contact .k{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);min-width:92px}
:lang(ar) .contact .k{font-family:var(--sans-ar);letter-spacing:0;font-size:.85rem}
.contact .v{user-select:all;color:var(--heading)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--teal-950);color:#EDE8DC;padding:10px 18px;border-radius:var(--r-pill);font-size:.9rem;z-index:30;visibility:hidden;opacity:0}

.foot{padding-block:28px 40px;border-top:1px solid var(--border);font-size:.8rem;color:var(--text-muted)}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot .legal{margin:0;line-height:1.7}
.foot a{color:var(--text-muted)}
.foot a:hover{color:var(--brand)}
.nojs{margin:24px 0;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--error)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<header class="top">
  <div class="wrap">
    <!-- primary (teal ink) on the cream ground, reversed (cream ink) on the dark
         theme. Both transparent, so neither leaves a patch on the other ground. -->
    <a class="home" href="{{HOME}}" aria-label="{{HOME_ARIA}}" data-home-en="/" data-home-ar="/ar/"
       data-aria-en="{{HOME_ARIA_EN}}" data-aria-ar="{{HOME_ARIA_AR}}">
      <img class="logo logo-light" alt="AI Profit Lab" src="/assets/brand/wordmark-primary.svg" width="152" height="26">
      <img class="logo logo-dark" alt="AI Profit Lab" src="/assets/brand/wordmark-reversed.svg" width="152" height="26">
    </a>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en" aria-pressed="true">English</button>
        <button type="button" id="lang-ar" data-lang="ar" aria-pressed="false" lang="ar">العربية</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="shell">
    <aside class="rail" aria-label="Sections">
      <ol id="rail"></ol>
      <div class="meta" id="railMeta"></div>
    </aside>
    <main id="main">
      <noscript><div class="nojs">{{NOSCRIPT}}</div></noscript>
      <div class="mbar" id="mbar">
        <div class="row"><b id="mbarTitle"></b><span id="mbarCount" class="mono" dir="ltr"></span></div>
        <div class="track"><i id="mbarFill"></i></div>
      </div>
      <form id="form" novalidate autocomplete="on"></form>
    </main>
  </div>
</div>

<footer class="foot">
  <div class="wrap">
    <!-- The legal blocks are CHROME["en"/"ar"]["legal"] from tools/v4/kit.py, the
         exact markup every v4 page renders. Never retype them here. Both ship,
         because the language toggle can turn either page into the other; render()
         shows the one matching S.lang (data-only), and the build hides the other
         for a visitor without JS. -->
    <p class="legal" lang="en" dir="ltr" data-only="en"{{HIDE_EN}}>
      {{LEGAL_EN}}
    </p>
    <p class="legal" lang="ar" dir="rtl" data-only="ar"{{HIDE_AR}}>
      {{LEGAL_AR}}
    </p>
    <span dir="ltr">aiprofitlab.io · hello@aiprofitlab.io</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------------- motion ---------------- */
const hasGsap = typeof window.gsap !== "undefined";

  const items = $$(".step-head .eyebrow, .step-head .lede, .fields>*, .welcome-body>*, .rev>section, .nav", form);
  gsap.fromTo(wipe, { yPercent:106 }, { yPercent:0, duration:1, ease:EASE, overwrite:"auto" });
  gsap.fromTo(items, { autoAlpha:0, y:24 }, { autoAlpha:1, y:0, duration:.8, ease:EASE, stagger:{ amount:Math.min(.45, items.length * .05) }, delay:.08, overwrite:"auto", clearProps:"transform,opacity,visibility" });

const thumbs = new WeakMap();
function thumb(file){ if (!thumbs.has(file)) thumbs.set(file, URL.createObjectURL(file)); return thumbs.get(file); }

/* ---------------- values as readable text ---------------- */
function optLabel(list, v){ const o = list.find(x => x.v === v); return o ? tr(o.l) : v; }
function valueText(f, v){
  // An upload field's files live in `picked`, not in the answer, so it can have
  // content while its answer is still null.
  if (v == null && f.type !== "upload") return "";
  switch (f.type) {
    case "radio": return v ? optLabel(f.o, v) : "";
    case "chips": return (v || []).map(x => optLabel(f.o, x)).join(", ");
    case "colours": return (v || []).map(x => optLabel(COLOURS, x)).join(", ");
    case "archetypes": return (v || []).map(x => optLabel(ARCHETYPES, x)).join(", ");
    case "logotype": return (v || []).map(x => optLabel(LOGO_TYPES, x)).join(", ");
    case "typeface": return (v || []).map(x => optLabel(TYPEFACES, x)).join(", ");
    case "sliders": {
      const any = f.items.some(it => v[it.v] != null && v[it.v] !== 50);
      if (!any) return "";
      return f.items.map(it => { const n = v[it.v] == null ? 50 : v[it.v];
        const side = n < 50 ? `${tr(UI.lean)} ${tr(it.a)}` : n > 50 ? `${tr(UI.lean)} ${tr(it.b)}` : tr(UI.balanced);
        return `${tr(it.a)} ↔ ${tr(it.b)}: ${side} (${n})`; }).join("\n");
    }
    case "thisthat": return PAIRS.filter(p => v[p.v]).map(p => `${tr(p.a)} / ${tr(p.b)}: ${v[p.v] === "a" ? tr(p.a) : v[p.v] === "b" ? tr(p.b) : tr(UI.either)}`).join("\n");
    case "competitors": return (v || []).filter(r => r && (r.name || r.link)).map(r => [r.name, r.link].filter(Boolean).join(" — ")).join("\n");
    case "upload": {
      const parts = [];
      (picked[f.k] || []).forEach(x => parts.push(x.name));
      if (v && v.links) parts.push(v.links);
      return parts.join("\n");
    }
    default: return String(v || "");
  }
}
function isFilled(f, v){
  if (f.type === "competitors") return Array.isArray(v) && v.some(r => r && r.name && r.name.trim());
  if (Array.isArray(v)) return v.length > 0;
  if (v && typeof v === "object") return Object.keys(v).length > 0;
  return !!(v && String(v).trim());
}
function fieldError(f){
  const v = S.a[f.k];
  if (f.req && !isFilled(f, v)) return (["chips","archetypes","colours","logotype","typeface"].includes(f.type)) ? tr(UI.pickOne) : tr(UI.fill);
  if (f.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())) return tr(UI.email);
  return "";
}
const stepComplete = (s) => allFields(s).every(f => !fieldError(f));

function renderReview(answers, opts){

    ${allFields(s).map(f => { const txt = valueText(f, answers[f.k]); const miss = !opts.readonly && f.req && !isFilled(f, answers[f.k]);
      return `<div><dt>${esc(tr(f.l))}</dt><dd class="${txt ? "" : (miss ? "miss" : "empty")}">${txt ? esc(txt) : (miss ? tr(UI.missing) : tr(UI.noAnswer))}</dd></div>`; }).join("")}
  </dl></section>`).join("");
}

function toMarkdown(answers, meta){

      <div class="contact">
        <div><span class="k">${tr(UI.emailK)}</span><span class="v" dir="ltr">${CONTACT.email}</span><a href="mailto:${CONTACT.email}?subject=${encodeURIComponent("Brand discovery — " + (S.a.business || ""))}">${tr(UI.openMail)}</a></div>
        <div><span class="k">${tr(UI.waK)}</span><span class="v" dir="ltr">${CONTACT.wa}</span><a href="${CONTACT.waLink}" target="_blank" rel="noopener">${tr(UI.openWa)}</a></div>
      </div>
    </div></div>
    <div class="nav"><span></span><button type="button" class="btn btn-ghost" data-act="new">${tr(UI.newForm)}</button></div>`;
}

function render(animate){
  document.documentElement.lang = S.lang;
  document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  document.title = tr(UI.title);
  $$("[data-only]").forEach(el => { el.hidden = el.dataset.only !== S.lang; });
  const home = $(".home"); home.href = home.dataset["home" + (S.lang === "ar" ? "Ar" : "En")];
  home.setAttribute("aria-label", home.dataset["aria" + (S.lang === "ar" ? "Ar" : "En")]);
  const draw = () => {
    const s = STEPS[S.step];
    $("#form").innerHTML = S.done ? renderDone() : s.id === "welcome" ? renderWelcome() : s.id === "review" ? renderReviewStep() : renderQuestions(s);
    renderRail();
  };
  if (animate) swapStep(draw); else draw();
}

function go(i){
  if (i < 0 || i >= STEPS.length) return;
  S.step = i; persist();
  render(true);
  window.scrollTo({ top:0, behavior: reduce ? "auto" : "smooth" });
}

function validateStep(s){
  let first = null;
  allFields(s).forEach(f => {
    const msg = fieldError(f); const q = $(`[data-q="${f.k}"]`); if (!q) return;
    q.classList.toggle("invalid", !!msg);
    const e = $(`#e-${f.k}`); if (e) e.textContent = msg;
    if (msg && !first) first = q;
  });
  if (first) {
    first.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block:"center" });
    const inp = first.querySelector("input,textarea,button"); if (inp) setTimeout(() => inp.focus({ preventScroll:true }), reduce ? 0 : 350);
    return false;
  }
  return true;
}
function clearErr(k){ const q = $(`[data-q="${k}"]`); if (q && q.classList.contains("invalid")) { const f = Q_STEPS.flatMap(allFields).find(x => x.k === k); if (f && !fieldError(f)) q.classList.remove("invalid"); } }

/* ---------------- submit ---------------- */
async function submit(){
  const bad = Q_STEPS.find(s => !stepComplete(s));
  if (bad) { go(STEPS.indexOf(bad)); setTimeout(() => validateStep(bad), reduce ? 50 : 700); return; }
  const btn = $("#submitBtn"); btn.disabled = true;
  const bytes = totalBytes();
  btn.textContent = tr(bytes ? UI.uploading : UI.sending);
  const payload = { version:1, lang:S.lang, submittedAt:new Date().toISOString(), answers:JSON.parse(JSON.stringify(S.a)) };
  let saved = false;
  if (BRIEF_ENDPOINT) {
    try {
      const files = await allFiles();
      /* text/plain on purpose, exactly like /en/onboarding/: an application/json
         body triggers a CORS preflight, and an Apps Script web app cannot answer
         an OPTIONS request. */
      const r = await fetch(BRIEF_ENDPOINT, {
        method:"POST",
        headers:{ "Content-Type":"text/plain;charset=utf-8" },
        body:JSON.stringify(Object.assign(briefFields(payload), { files }))
      });
      if (!r.ok) throw new Error("http " + r.status);
      const d = await r.json();
      if (!d || !d.ok) throw new Error(d && d.error ? d.error : "rejected");
      saved = true;
      track("brand_discovery_sent", { files: files.length });
    } catch (e) {
      track("brand_discovery_send_failed", { why: String(e && e.message).slice(0, 60) });
    }
  }
  S.done = { saved, payload };
  if (saved) {
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    Object.keys(picked).forEach(k => delete picked[k]);
  }
  render(true);
  window.scrollTo({ top:0, behavior: reduce ? "auto" : "smooth" });
}

/* Everything the Apps Script reads except the files. Question rows come from
   STEPS, so a question added there becomes a sheet column with no change to the
   script. Labels and option text are English (see inLang). */
function briefFields(payload){
  const fields = Q_STEPS.flatMap(allFields);
  return inLang("en", () => ({
    business: S.a.business || "",
    name: S.a.contactName || "",
    email: S.a.email || "",
    whatsapp: S.a.phone || "",
    projectType: valueText(fields.find(f => f.k === "projectType"), S.a.projectType),
    lang: payload.lang,
    submittedAt: payload.submittedAt,
    answered: fields.filter(answered).length,
    of: fields.length,
    rows: [{ q:"Form language", v: payload.lang === "ar" ? "Arabic" : "English" }]
      .concat(fields.map(f => ({ q: tr(f.l), v: valueText(f, S.a[f.k]) }))),
    text: toMarkdown(S.a, payload)
  }));
}

/* An upload field counts as answered by a file or a link; everything else by isFilled. */
function answered(f){
  if (f.type !== "upload") return isFilled(f, S.a[f.k]);
  return (picked[f.k] || []).length > 0 || !!String((S.a[f.k] || {}).links || "").trim();
}
function totalBytes(){ return Object.values(picked).flat().reduce((n, f) => n + f.size, 0); }
function readFile(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const s = String(r.result); res({ name:file.name, type:file.type || "application/octet-stream", size:file.size, data:s.slice(s.indexOf(",") + 1) }); };
    r.onerror = () => rej(new Error("could not read " + file.name));
    r.readAsDataURL(file);
  });
}
/* Each file carries its question's English label, which the Apps Script puts in
   front of the Drive link so the email says which upload field it came from. */
function allFiles(){
  const fields = Q_STEPS.flatMap(allFields).filter(f => f.type === "upload");
  return Promise.all(fields.flatMap(f => (picked[f.k] || []).map(file => readFile(file).then(o => { o.field = f.l.en; return o; }))));
}

function downloadMd(answers, meta){
  const md = toMarkdown(answers, meta);
  const name = "brand-discovery-" + ((answers.business || "answers").toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g, "-").replace(/^-|-$/g, "") || "answers") + ".md";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type:"text/markdown;charset=utf-8" }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast(tr(UI.downloaded));
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast(tr(UI.copied)); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (x) {}
    ta.remove(); toast(tr(ok ? UI.copied : UI.copyFail));
  }
}

/* ---------------- uploads ----------------
   Picking a file only holds it; nothing leaves the browser until the brief is
   sent, and then every file goes in the same POST (see allFiles). */
function addFiles(k, list){
  if (!list.length) return;
  const arr = picked[k] = picked[k] || [];
  const rejected = [];
  list.forEach(file => {
    if (file.size > MAX_FILE) { rejected.push(UI.tooBig[S.lang](file.name)); return; }
    if (totalBytes() + file.size > MAX_TOTAL) { rejected.push(UI.tooMuch[S.lang](file.name)); return; }
    if (!arr.some(p => p.name === file.name && p.size === file.size)) arr.push(file);
  });
  $(`#fe-${k}`).textContent = rejected.length ? rejected.join(" ") + " " + tr(UI.sendOther) : "";
  paintFiles(k);
}
function paintFiles(k){ $(`#files-${k}`).innerHTML = (picked[k] || []).map((x, i) => fileChip(k, x, i)).join(""); }

/* ---------------- events ---------------- */
const form = $("#form");
form.addEventListener("submit", e => e.preventDefault());
form.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.k && t.type !== "radio") { S.a[t.dataset.k] = t.value; clearErr(t.dataset.k); persist(); }
  else if (t.dataset.slider) {
    const k = t.dataset.slider; S.a[k] = Object.assign({}, S.a[k], { [t.dataset.v]: +t.value }); persist();
    const ends = t.parentElement.querySelectorAll(".ends span"); ends[0].classList.toggle("on", +t.value < 40); ends[1].classList.toggle("on", +t.value > 60);
  }
  else if (t.dataset.comp != null) {
    const rows = (S.a.competitors || []).slice(); const i = +t.dataset.comp;
    rows[i] = Object.assign({}, rows[i], { [t.dataset.part]: t.value }); S.a.competitors = rows; clearErr("competitors"); persist();
  }
  else if (t.dataset.uplinks) { const k = t.dataset.uplinks; S.a[k] = Object.assign({ files:[] }, S.a[k], { links:t.value }); persist(); }
});
form.addEventListener("change", e => {
  const t = e.target;
  if (t.type === "radio" && t.dataset.k) { S.a[t.dataset.k] = t.value; clearErr(t.dataset.k); persist(); }
  if (t.dataset.upload) { addFiles(t.dataset.upload, Array.from(t.files || [])); t.value = ""; }
});
form.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.multi) {
    const k = b.dataset.multi, v = b.dataset.v, max = +b.dataset.max || 0;
    let sel = Array.isArray(S.a[k]) ? S.a[k].slice() : [];
    if (sel.includes(v)) sel = sel.filter(x => x !== v);
    else { if (max && sel.length >= max) { const drop = sel.shift(); const old = $(`[data-multi="${k}"][data-v="${drop}"]`); if (old) old.setAttribute("aria-pressed", "false"); } sel.push(v); }
    S.a[k] = sel; b.setAttribute("aria-pressed", String(sel.includes(v)));
    const c = $(`#c-${k}`); if (c) c.textContent = UI.selected[S.lang](sel.length, max);
    if (hasGsap && !reduce && sel.includes(v)) gsap.fromTo(b, { scale:.97 }, { scale:1, duration:.35, ease:EASE, overwrite:"auto", clearProps:"transform" });
    clearErr(k); persist(); return;
  }
  if (b.dataset.tt) {
    const k = b.dataset.tt, p = b.dataset.p, v = b.dataset.v;
    const cur = Object.assign({}, S.a[k]); cur[p] = cur[p] === v ? undefined : v; if (!cur[p]) delete cur[p]; S.a[k] = cur;
    $$(`[data-tt="${k}"][data-p="${p}"]`).forEach(x => x.setAttribute("aria-pressed", String(cur[p] === x.dataset.v)));
    persist(); return;
  }
  if (b.dataset.unfile) {
    const k = b.dataset.unfile, i = +b.dataset.i;
    picked[k] = (picked[k] || []).filter((_, j) => j !== i);
    $(`#fe-${k}`).textContent = "";
    paintFiles(k); return;
  }
  if (b.dataset.go) { go(+b.dataset.go); return; }
  if (b.dataset.nav === "next") { const s = STEPS[S.step]; if (s.f && !validateStep(s)) return; go(S.step + 1); return; }
  if (b.dataset.nav === "back") { go(S.step - 1); return; }
  if (b.dataset.nav === "submit") { submit(); return; }
  if (b.dataset.act === "download") { downloadMd(S.done ? S.done.payload.answers : S.a, S.done ? S.done.payload : null); return; }
  if (b.dataset.act === "copy") { copyText(toMarkdown(S.done ? S.done.payload.answers : S.a, S.done ? S.done.payload : null)); return; }
  if (b.dataset.act === "new") { S.a = {}; S.done = null; Object.keys(picked).forEach(k => delete picked[k]); try { localStorage.removeItem(DRAFT_KEY); } catch (x) {} go(0); return; }
});
$("#rail").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { S.done = null; go(+b.dataset.go); } });
$$(".lang button").forEach(b => b.addEventListener("click", () => { if (S.lang === b.dataset.lang) return; S.lang = b.dataset.lang; persist(); render(true); }));

/* ---------------- boot ---------------- */
render(false);
if (hasGsap && !reduce) {
  gsap.fromTo(".top .wrap > *", { autoAlpha:0, y:-8 }, { autoAlpha:1, y:0, duration:.6, ease:EASE, stagger:.08, clearProps:"all" });
  gsap.fromTo(".rail li", { autoAlpha:0, x: S.lang === "ar" ? 12 : -12 }, { autoAlpha:1, x:0, duration:.6, ease:EASE, stagger:.04, delay:.15, clearProps:"all" });
  animateIn();
}
})();
</script>
