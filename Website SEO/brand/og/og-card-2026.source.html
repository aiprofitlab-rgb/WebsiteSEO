<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:
    radial-gradient(60rem 30rem at 88% -14%, rgba(216,146,52,.20), transparent 60%),
    linear-gradient(168deg,#0F6E56 0%,#0A3D30 78%,#072B22 100%);
  color:#F1EFE8;position:relative;overflow:hidden;
}
.card{position:absolute;inset:0;height:630px;display:grid;grid-template-columns:1fr 452px}
.left{padding:52px 40px 52px 64px;display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:3}
.wm{height:44px;width:auto;align-self:flex-start;display:block}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#E8C98F;margin:0 0 16px}
.eyebrow span{color:#D89234}
h1{font-family:'Marcellus',serif;font-weight:400;font-size:58px;line-height:1.08;color:#FFFFFF;letter-spacing:.005em}
.role{font-size:25px;font-weight:600;color:#E8C98F;margin-top:12px;letter-spacing:.005em}
.rule{width:74px;height:2px;background:#D89234;margin:22px 0 18px;border-radius:2px}
.sub{font-size:20px;line-height:1.5;color:rgba(241,239,232,.84);max-width:520px}
.strip{border-top:1px solid rgba(232,201,143,.26);padding-top:15px;display:flex;align-items:center;gap:13px;white-space:nowrap;
  font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.02em;color:rgba(241,239,232,.76)}
.strip i{color:rgba(232,201,143,.5);font-style:normal}
.photo{position:relative;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block}
.photo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,#0A3D30 0%,rgba(10,61,48,.86) 14%,rgba(10,61,48,.10) 40%,rgba(7,43,34,.10) 100%)}
.edge{position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,rgba(216,146,52,.75) 30%,rgba(216,146,52,.75) 70%,transparent);z-index:4}
.stars{position:absolute;inset:0;z-index:1}
.stars i{position:absolute;color:#E8C98F;font-style:normal;opacity:.14}
</style></head><body>
