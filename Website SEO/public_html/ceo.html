<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1613" media="(prefers-color-scheme: dark)">
<!--
  PRIVATE CEO DASHBOARD — https://aiprofitlab.io/ceo/

  This file is public (it ships from the public website repo) and therefore
  holds NO data and NO key. After sign-in it reads everything from the private
  ceo-dashboard-api on the VPS (SmartChatBot/ceo-dashboard-api), which checks
  the password and holds the Google, OpenAI and Resend credentials.

  Deliberately carries NO analytics: no GA4, no Clarity, no Aiden widget.
  Clarity uploads the rendered DOM, and this DOM is customers' names, phone
  numbers and chat transcripts. Keep it that way; tools/add_aiden_widget.py
  and tools/build_aiden_index.py both exclude this file by name.

  Everything a visitor typed is rendered through esc() (or t(), which is esc()
  plus the "•••" mask styling). Never build HTML from a data field without one
  of them — a chat message is attacker-controlled text.

  THE CEO VIEW. One page, nine tabs (?tab=…), all drawn from ONE /data call.
  The API decides what is real: with CEO_DASHBOARD off (or ?preview=1) it sends
  a locked preview whose amounts and names are already masked on the server,
  and sample data in the four add-on tabs. This page only draws what it gets.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://offer.aiprofitlab.io http://localhost:8094; base-uri 'none'; form-action 'none'">
<title>CEO Dashboard · AI Profit Lab</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal-950:#072B22;--teal-900:#0A3D30;--teal:#0F6E56;--teal-600:#158268;
  --amber:#BA7517;--amber-bright:#D89234;--amber-pale:#E8C98F;--amber-text:#8F5A11;
  --cream:#F1EFE8;--panel:#FAF8F2;--panel-2:#EAE4D5;--ink:#232B26;--muted:#5A665D;--line:#DED8C8;
  --wa:#1FAF5E;--alert:#A6431F;
  --display:'Marcellus',Georgia,serif;
  --sans:'IBM Plex Sans','IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,.7,.25,1);
  --r-card:16px;--r-pill:99px;
  --shadow-card:0 26px 50px -34px rgba(7,43,34,.55);
  --bg:var(--cream);--surface:var(--panel);--surface-2:var(--panel-2);--text:var(--ink);--text-muted:var(--muted);
  --heading:var(--teal-950);--border:var(--line);--brand:var(--teal);--on-brand:#fff;--accent:var(--amber);--accent-text:var(--amber-text);
  --good:#0F6E56;--warn:#8F5A11;--bad:#A6431F;--grid:rgba(35,43,38,.08);
  /* Costs in charts: a warm neutral, so money in (teal) stays the point. Validated
     against both surfaces with the dataviz palette check. */
  --c-cost:#8E8573;
  /* EXTENSION to the brand: the add-on "sample" marker only. A calm blue that no
     brand colour uses, so a sample can never be read as a status. */
  --sample:#3E6F9E;
  --hero-bg:#072B22;--hero-text:#EDE8DC;--hero-muted:rgba(237,232,220,.66);
  --bar-h:60px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1613;--surface:#11201B;--surface-2:#16261F;--text:#EDE8DC;--text-muted:#A6B2A9;--heading:#EDE8DC;--border:#24382F;
    --brand:#3FAE8A;--on-brand:#0A1613;--accent:#D89234;--accent-text:#EBAB53;
    --good:#3FAE8A;--warn:#EBAB53;--bad:#E07A55;--grid:rgba(237,232,220,.08);
    --c-cost:#6E776F;--sample:#7EA6D2;--hero-bg:#0D241D;
    --shadow-card:0 20px 50px -30px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1613;--surface:#11201B;--surface-2:#16261F;--text:#EDE8DC;--text-muted:#A6B2A9;--heading:#EDE8DC;--border:#24382F;
  --brand:#3FAE8A;--on-brand:#0A1613;--accent:#D89234;--accent-text:#EBAB53;
  --good:#3FAE8A;--warn:#EBAB53;--bad:#E07A55;--grid:rgba(237,232,220,.08);
  --c-cost:#6E776F;--sample:#7EA6D2;--hero-bg:#0D241D;
  --shadow-card:0 20px 50px -30px rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--heading);margin:0;letter-spacing:-.005em;text-wrap:balance}
a{color:var(--brand);text-underline-offset:3px}
button{font:inherit;color:inherit}
::selection{background:var(--amber-pale);color:var(--teal-950)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
[hidden]{display:none !important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.wrap{width:min(1180px,100%);margin:0 auto;padding:0 16px}
@media (min-width:720px){.wrap{padding:0 28px}}
.mask{letter-spacing:.14em;opacity:.55}

/* ---- top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--border)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:60px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto}
.logo img{height:22px;width:auto;display:block}
.logo span{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);border-left:1px solid var(--border);padding-left:12px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-pill);padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:var(--r-pill);font-size:.82rem;cursor:pointer;color:var(--text-muted);transition:background .2s var(--ease),color .2s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);padding:7px 14px;font-size:.84rem;cursor:pointer;text-decoration:none;color:var(--text);transition:transform .15s var(--ease),border-color .2s var(--ease)}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:500}
.btn[disabled]{opacity:.55;cursor:default}
.updated{font-size:.78rem;color:var(--text-muted)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- the locked preview ---- */
.lockbar{background:var(--teal-950);color:#EDE8DC;border-bottom:1px solid rgba(237,232,220,.12)}
.lockbar .wrap{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding-top:11px;padding-bottom:11px;font-size:.88rem}
.lockbar svg{width:18px;height:18px;flex:none;color:#E8C98F;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lockbar .lb-text{flex:1 1 320px;min-width:0}
.lockbar b{font-weight:600}
.lockbar .btn{background:#EDE8DC;border-color:#EDE8DC;color:#072B22;font-weight:500}
.lockbar a.lb-link{color:#E8C98F;font-size:.84rem}

/* ---- signal rail ---- */
.rail{position:relative;margin:18px 0 0;background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:5px}
.rail-track{position:relative;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}
@media (max-width:1179px){.rail-track{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:899px){.rail-track{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:639px){
  .rail{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0}
  .rail-track{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 11px}
  .rail-track::-webkit-scrollbar{display:none}
  .tile{flex:0 0 auto;width:152px;scroll-snap-align:start}
}
.plate{position:absolute;left:0;top:0;width:0;height:0;border-radius:13px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border),0 12px 26px -18px rgba(7,43,34,.55);pointer-events:none;z-index:0}
.tile{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:10px 8px 11px 9px;border:0;background:transparent;border-radius:13px;cursor:pointer;text-align:left;min-width:0;color:var(--text-muted);transition:color .2s var(--ease),transform .12s var(--ease)}
.tile:hover{color:var(--text)}
.tile:active{transform:scale(.97)}
.tile[aria-selected="true"]{color:var(--heading)}
.t-top{display:flex;align-items:center;gap:6px;width:100%;min-width:0}
.t-ico{flex:none;display:block;width:16px;height:16px}
.t-ico svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.t-label{font-weight:500;font-size:.84rem;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-status{display:flex;align-items:flex-start;gap:6px;font-size:.72rem;line-height:1.3;color:var(--text-muted);max-width:100%;min-height:2.6em}
.t-status i{margin-top:.38em}
.t-status span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t-status i,.mtab i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--text-muted)}
.tone-alert .t-status{color:var(--bad)}.tone-alert .t-status i,.mtab.tone-alert i{background:var(--bad)}
.tone-watch .t-status{color:var(--warn)}.tone-watch .t-status i,.mtab.tone-watch i{background:var(--warn)}
.tone-good .t-status i,.mtab.tone-good i{background:var(--good)}
.tone-calm .t-status i,.mtab.tone-calm i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-muted)}
.t-sample{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--sample)}

/* The rail, folded: labels only, pinned under the bar once the full rail scrolls away. */
.minirail{position:fixed;left:0;right:0;top:var(--bar-h);z-index:19;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--border);transform:translateY(-100%);opacity:0;visibility:hidden;transition:transform .32s var(--ease),opacity .2s var(--ease),visibility 0s .32s}
.minirail.on{transform:none;opacity:1;visibility:visible;transition:transform .32s var(--ease),opacity .2s var(--ease)}
.minirail .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-top:6px;padding-bottom:6px}
.minirail .wrap::-webkit-scrollbar{display:none}
.mtab{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:6px 12px;border-radius:99px;font-size:.84rem;color:var(--text-muted);cursor:pointer;position:relative}
.mtab[aria-current="true"]{background:var(--surface);color:var(--heading);box-shadow:inset 0 0 0 1px var(--border)}
.mtab .t-sample{position:static;width:6px;height:6px}
@media (prefers-reduced-motion:reduce){.minirail,.minirail.on{transition:opacity .15s linear}}

/* ---- page ---- */
main{padding:6px 0 60px}
.eyebrow{font-family:var(--mono);font-size:.74rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}
.eyebrow::before{content:"✼ ";color:var(--accent)}
.tabhead{margin:30px 0 4px}
.tabhead h1{font-size:clamp(1.9rem,4.4vw,2.8rem);line-height:1.08;margin-top:6px}
.tabhead p{margin:8px 0 0;color:var(--text-muted);max-width:68ch}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text-muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good)}

.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:980px){.grid.two.top{align-items:start}.grid.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}.grid.half{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:clamp(16px,2.4vw,24px);min-width:0}
.card h3,.h3{font-size:1.2rem;line-height:1.2}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-head .hint{font-size:.78rem;color:var(--text-muted)}
.muted{color:var(--text-muted)}
.small{font-size:.82rem}
.empty{font-size:.88rem;color:var(--text-muted);padding:6px 0}
.offline{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--text-muted);background:var(--surface-2);border-radius:12px;padding:12px 14px}
.offline b{color:var(--text)}
.tlink{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;white-space:nowrap}
.tlink:hover{text-decoration:underline}

/* ---- a question and its answer ---- */
.qs{margin-top:38px}
.qh{margin-bottom:14px}
.qh h2{font-size:clamp(1.35rem,2.4vw,1.75rem);line-height:1.2}
.qh .hint{margin:6px 0 0;color:var(--text-muted);max-width:72ch;font-size:.95rem}
.tuned{font-size:.78rem;color:var(--text-muted);margin:10px 0 0;max-width:84ch}
.unlock{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border:1px dashed color-mix(in srgb,var(--brand) 50%,var(--border));border-radius:12px;font-size:.86rem;color:var(--text-muted);background:color-mix(in srgb,var(--brand) 4%,transparent)}
.unlock b{color:var(--heading);font-weight:500}
.unlock .u-ico{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-brand);font-family:var(--mono);font-size:.9rem;line-height:1}

/* ---- the hero: the business as a picture ---- */
.hero{position:relative;margin-top:18px;background:var(--hero-bg);color:var(--hero-text);border-radius:22px;padding:clamp(18px,3vw,34px);overflow:hidden;border:1px solid rgba(237,232,220,.08)}
.hero h1{color:var(--hero-text);font-size:clamp(1.9rem,4.4vw,2.8rem);line-height:1.08;margin-top:6px}
.hero .eyebrow{color:var(--amber-pale)}
.hero .eyebrow::before{color:var(--amber-bright)}
.hero .live{color:var(--hero-muted)}
.hero .live i{background:#3FAE8A}
.hero-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero-grid{display:grid;gap:clamp(18px,3vw,34px);margin-top:18px}
@media (min-width:980px){.hero-grid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:center}}
.board{margin:0;min-width:0}
.board-svg{width:100%;height:auto;display:block;overflow:visible}
.board-svg .seat{transform-box:fill-box;transform-origin:center}
.s-free{fill:none;stroke:rgba(237,232,220,.26);stroke-width:1.3}
.s-sold{fill:#3FAE8A}
.s-pending{fill:rgba(216,146,52,.22);stroke:#D89234;stroke-width:1.6}
.s-losing{fill:#E07A55}
.seat-hit{fill:transparent}
.stage{fill:rgba(63,174,138,.14);stroke:rgba(63,174,138,.55);stroke-width:1}
.stage-t{fill:var(--hero-muted);font-family:var(--mono);font-size:9.5px;letter-spacing:.18em}
.rung-t{fill:var(--hero-muted);font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums}
.rung-t.live{fill:#E8C98F}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;font-size:.76rem;color:var(--hero-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lg-sold{background:#3FAE8A}.lg-pend{background:rgba(216,146,52,.22);box-shadow:inset 0 0 0 1.6px #D89234}.lg-free{box-shadow:inset 0 0 0 1.3px rgba(237,232,220,.4)}.lg-lose{background:#E07A55}
.board-note{margin:8px 0 0;font-size:.76rem;color:var(--hero-muted)}
.board-prices{display:none;margin:10px 0 0;font-family:var(--mono);font-size:.72rem;color:var(--hero-muted);line-height:1.6}
.board-prices b{color:var(--amber-pale);font-weight:500}
@media (max-width:640px){.rung-t{display:none}.board-prices{display:block}.stage-t{font-size:14px}}
.hero-side{display:grid;gap:20px;min-width:0}
.h-lbl{display:block;font-size:.82rem;color:var(--hero-muted)}
.h-fig{display:block;font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,5.6vw,3.7rem);line-height:1.02;letter-spacing:-.01em;color:var(--hero-text);margin:4px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.h-sub{display:block;font-size:.8rem;color:var(--hero-muted)}
.h-delta{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:.74rem;padding:2px 9px;border-radius:99px;background:rgba(237,232,220,.08);color:var(--hero-text)}
.h-delta.up{color:#7FD3B4}.h-delta.down{color:#F0A184}
.h-ring{display:flex;align-items:center;gap:16px}
.h-ring svg{width:104px;height:104px;flex:none;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:rgba(237,232,220,.12);stroke-width:9}
.ring-arc{fill:none;stroke:#3FAE8A;stroke-width:9;stroke-linecap:round}
.h-ring b{display:block;font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1;color:var(--hero-text);font-variant-numeric:tabular-nums}
.h-ring span{font-size:.82rem;color:var(--hero-muted)}
.verdict{margin:0;font-family:var(--display);font-size:clamp(1.12rem,2vw,1.35rem);line-height:1.35;color:var(--hero-text);max-width:40ch;padding-top:16px;border-top:1px solid rgba(237,232,220,.14)}
.hero-under{margin-top:16px}
.leak-total{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;color:var(--heading);margin:-4px 0 14px;font-variant-numeric:tabular-nums}

/* ---- ranked bars ---- */
.rank{display:grid;gap:12px}
.rrow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.7fr) 112px;gap:4px 14px;align-items:center}
.rank.wide-v .rrow{grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr) 196px}
.rl{min-width:0;display:flex;flex-direction:column}
.rk{font-size:.9rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rs{font-size:.74rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{position:relative;height:12px;background:var(--surface-2);border-radius:4px}
.rb{position:absolute;top:0;bottom:0;left:0;width:var(--w);border-radius:4px;background:var(--brand);transform-origin:left center}
.signed .rb.pos{left:50%;width:calc(var(--w) / 2)}
.signed .rb.neg{left:auto;right:50%;width:calc(var(--w) / 2);transform-origin:right center}
.zero{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--text-muted);z-index:1}
.avgline{position:absolute;top:-5px;bottom:-5px;width:0;border-left:1.5px dashed var(--heading);z-index:1}
.tone-bad .rb{background:var(--bad)}
.tone-neutral .rb{background:color-mix(in srgb,var(--brand) 55%,var(--surface-2))}
.rv{font-family:var(--mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.tone-bad .rv{color:var(--bad)}
.rank-key{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.76rem;color:var(--text-muted)}
@media (max-width:640px){.rrow{grid-template-columns:minmax(0,1fr) auto}.rv{order:2}.rt{grid-column:1 / -1;order:3}}

/* ---- heatmap ---- */
.heat-wrap{overflow-x:auto;margin:0 -2px;padding:0 2px 4px}
.heat{display:grid;grid-template-columns:minmax(150px,1.7fr) repeat(var(--cols),minmax(20px,1fr));gap:3px;min-width:calc(150px + var(--cols) * 24px);align-items:center}
.hc{font-family:var(--mono);font-size:.62rem;color:var(--text-muted);text-align:center;white-space:nowrap;padding-bottom:4px}
.hc.quiet{color:var(--heading)}
.hr{font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.cell{height:26px;border-radius:4px;background:color-mix(in oklab,var(--brand) calc(var(--v) * 90%),var(--surface-2))}
.cell.quiet{outline:1px dashed var(--text-muted);outline-offset:1px}
.cell.f-raise{box-shadow:inset 0 0 0 2px var(--good)}
.cell.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.heat-key{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.74rem;color:var(--text-muted)}
.heat-key .ramp{width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--brand))}

/* ---- charts ---- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .baseline{stroke:var(--text-muted);stroke-width:1;opacity:.5}
.chart .axis{fill:var(--text-muted);font-family:var(--mono);font-size:10px}
.chart .bar{fill:var(--brand)}
.chart .bar.cost{fill:var(--c-cost)}
.chart .bar.ghost{fill:none;stroke:var(--border)}
.chart .line{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pline{fill:none;stroke:var(--heading);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pdot{fill:var(--heading);stroke:var(--surface);stroke-width:2}
.chart .area{fill:var(--brand);opacity:.08}
.chart .avg{stroke:var(--heading);stroke-width:1.2;stroke-dasharray:4 4}
.chart .charge{fill:var(--surface);stroke:var(--heading);stroke-width:1.6}
.chart .best{fill:var(--heading);font-family:var(--mono);font-size:9.5px}
.chart .col .hit{fill:transparent}
.chart .col .cross{stroke:var(--text-muted);stroke-width:1;stroke-dasharray:2 3;opacity:0}
.chart .col .dot{fill:var(--brand);stroke:var(--surface);stroke-width:2;opacity:0}
.chart .col:hover .cross,.chart .col:hover .dot{opacity:1}
.chart .col:hover .bar{opacity:.85}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--heading);color:var(--bg);font-size:.78rem;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 10px));transition:opacity .12s}
.tip.on{opacity:1}
.chart-total{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:10px}
.chart-total div{font-size:.8rem;color:var(--text-muted)}
.chart-total b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--heading);font-variant-numeric:tabular-nums}
.ckey{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--text-muted);margin-bottom:10px}
.ckey span{display:inline-flex;align-items:center;gap:6px}
.ckey i{display:inline-block;width:10px;height:10px;border-radius:3px}
.ck-rev{background:var(--brand)}.ck-cost{background:var(--c-cost)}.ck-prof{height:2px !important;width:14px !important;background:var(--heading);border-radius:1px}
.ck-avg{height:0 !important;width:14px !important;border-top:1.5px dashed var(--heading);border-radius:0 !important}
.ck-charge{border-radius:50% !important;box-shadow:inset 0 0 0 1.6px var(--heading)}
.compare{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:.84rem;color:var(--text-muted)}
.compare b{color:var(--heading);font-weight:500;font-variant-numeric:tabular-nums}
.hlist{display:grid;gap:9px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:.88rem}
.hrow .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .v{font-family:var(--mono);font-size:.82rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.hrow .track{grid-column:1 / -1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hrow .fill{height:100%;border-radius:4px;background:var(--brand);transform-origin:left center}
.hrow.easy .k{font-weight:500}

/* funnel */
.funnel{display:grid;gap:8px}
.fstep{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 70px;gap:12px;align-items:center;font-size:.88rem}
.fstep .fb{height:22px;border-radius:5px;background:var(--brand);width:var(--w);transform-origin:left center;min-width:2px}
.fstep .fv{font-family:var(--mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
.fdrop{grid-column:2 / -1;font-size:.74rem;color:var(--bad);margin:-4px 0 0}
.fstep.nodata .fb{background:transparent;box-shadow:inset 0 0 0 1px var(--border);width:100%}
@media (max-width:640px){.fstep{grid-template-columns:minmax(0,1fr) 60px}.fstep .fbar{grid-column:1 / -1;order:3}.fdrop{grid-column:1 / -1}}

/* ladder */
.ladder{display:grid;gap:9px}
.rung{display:grid;grid-template-columns:80px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:.86rem}
.rung .rp{font-family:var(--mono);font-size:.8rem}
.rung .rbar{height:12px;border-radius:4px;background:var(--surface-2);position:relative;overflow:hidden}
.rung .rfill{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--brand);border-radius:4px;transform-origin:left center}
.rung .rn{font-family:var(--mono);font-size:.78rem;color:var(--text-muted);text-align:right}
.rung.live .rp{color:var(--heading);font-weight:500}
.rung.live .rp::after{content:" ●";color:var(--accent)}

/* ---- to-do ---- */
.todo{margin-top:42px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:clamp(16px,2.6vw,26px)}
.todo h2{font-size:clamp(1.3rem,2.4vw,1.6rem)}
.todo ol{list-style:none;margin:10px 0 0;padding:0}
.todo li{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:6px 14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--border)}
.todo li:first-child{border-top:0}
.todo .tt{font-size:.94rem}
.tag{justify-self:start;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tag.big{background:var(--brand);color:var(--on-brand)}
.tag.worth{box-shadow:inset 0 0 0 1px var(--brand);color:var(--brand)}
.tag.quick{box-shadow:inset 0 0 0 1px var(--border);color:var(--text-muted)}
@media (max-width:640px){.todo li{grid-template-columns:minmax(0,1fr)}}

/* ---- look closer ---- */
.closer-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.closer{display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-decoration:none;color:var(--text);transition:transform .18s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease);position:relative}
.closer:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-card)}
.closer:active{transform:scale(.99)}
.c-q{font-family:var(--display);font-size:1.12rem;color:var(--heading);line-height:1.25;padding-right:48px}
.c-line{font-size:.82rem;color:var(--text-muted)}
.c-go{margin-top:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.closer .tag-sample{position:absolute;top:14px;right:14px}
.tag-sample{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sample);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sample) 55%,transparent);border-radius:99px;padding:2px 7px;white-space:nowrap}

/* ---- sample banner, switch-on card ---- */
.samplebar{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:22px 0 0;padding:13px 15px;border-radius:14px;background:color-mix(in srgb,var(--sample) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--sample) 40%,var(--border));font-size:.88rem}
.samplebar .sb-dot{width:9px;height:9px;border-radius:50%;background:var(--sample);margin-top:6px;flex:none}
.samplebar .sb-text{flex:1 1 300px;min-width:0}
.samplebar b{color:var(--heading);font-weight:600}
.switch{margin-top:42px;background:var(--hero-bg);color:var(--hero-text);border-radius:22px;padding:clamp(22px,3.6vw,42px);display:grid;gap:22px}
@media (min-width:900px){.switch{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}}
.switch h2{color:var(--hero-text);font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.1}
.switch p{color:var(--hero-muted);margin:10px 0 0}
.switch ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.switch li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;font-size:.95rem}
.switch li::before{content:"✓";color:#3FAE8A;font-family:var(--mono)}
.switch .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.switch .btn{background:#EDE8DC;border-color:#EDE8DC;color:#072B22;font-weight:500;padding:11px 18px;font-size:.92rem}
.switch .btn.ghost{background:transparent;color:var(--hero-text);border-color:rgba(237,232,220,.35)}

/* ---- AI brief, leads, tables (kept from the first version) ---- */
.brief{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:clamp(18px,2.8vw,28px);overflow:hidden}
.brief::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),var(--amber-pale))}
.brief .headline{font-family:var(--display);font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.25;color:var(--heading);margin:10px 0 18px;max-width:52ch}
.brief-cols{display:grid;gap:18px}
@media (min-width:860px){.brief-cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
.brief h4{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:500;margin:0 0 8px}
.brief ul,.plain-list{margin:0;padding-left:18px}
.brief li,.plain-list li{margin:0 0 6px}
.suggest{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.92rem}
.lead-ai{padding:12px 0;border-top:1px solid var(--border)}
.lead-ai:first-child{border-top:0;padding-top:0}
.leads{display:grid;gap:10px}
.lead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--bg);cursor:pointer;text-align:left;width:100%;transition:border-color .2s var(--ease),transform .15s var(--ease)}
.lead:hover{border-color:var(--brand)}
.lead:active{transform:scale(.995)}
.lead .q{font-size:.95rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lead .meta{font-size:.78rem;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap}
.lead .when{font-size:.76rem;color:var(--text-muted);white-space:nowrap}
.contact{display:flex;gap:8px;flex-wrap:wrap;grid-column:1 / -1}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.74rem;padding:3px 10px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;white-space:nowrap}
.chip.wa{border-color:color-mix(in srgb,var(--wa) 60%,var(--border))}
.chip.wa::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--wa)}
.chip.hot{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.chip.why{color:var(--text-muted);background:transparent;font-family:var(--sans);text-transform:none}
.chip.best{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;white-space:nowrap}
.status.good{color:var(--good)}.status.good::before{content:"✓";font-family:var(--mono)}
.status.warn{color:var(--warn)}.status.warn::before{content:"◔";font-family:var(--mono)}
.status.bad{color:var(--bad)}.status.bad::before{content:"✕";font-family:var(--mono)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--border);background:var(--bg);border-radius:var(--r-pill);padding:8px 14px;font:inherit;font-size:.88rem;color:var(--text)}
.table-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 6px;border-bottom:1px solid var(--border);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--brand) 5%,transparent)}
tr.us td{background:color-mix(in srgb,var(--brand) 7%,transparent)}
tr.easy td{background:color-mix(in srgb,var(--good) 7%,transparent)}
.clip{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.show-sm{display:none}

.more{margin-top:12px}
.read{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:.9rem}
.theme-bar{display:flex;gap:6px;flex-wrap:wrap}
.theme-bar span{font-family:var(--mono);font-size:.72rem;color:var(--text-muted);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px 16px 14px;min-width:0}
.kpi .label{font-size:.8rem;color:var(--text-muted)}
.kpi .value{font-family:var(--display);font-size:clamp(1.8rem,4vw,2.3rem);line-height:1.1;color:var(--heading);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.78rem;color:var(--text-muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.facts div{font-size:.8rem;color:var(--text-muted)}
.facts b{display:block;font-family:var(--display);font-weight:400;font-size:1.45rem;color:var(--heading);font-variant-numeric:tabular-nums}
.alert-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--border)}

.profile{padding:12px 0;border-top:1px solid var(--border)}
.profile:first-child{border-top:0;padding-top:0}

/* ---- transcript drawer ---- */
dialog.drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(560px,100%);max-width:100%;border:0;padding:0;background:var(--bg);color:var(--text);box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}

.drawer-body{padding:18px 20px 40px;overflow-y:auto;flex:1}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}
.msg.v{background:var(--brand);color:var(--on-brand);margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:.7rem;color:var(--text-muted);text-align:center;margin:14px 0 8px;font-family:var(--mono)}
.close{border:1px solid var(--border);background:var(--surface);border-radius:50%;width:36px;height:36px;cursor:pointer;flex:none}

/* ---- sign in ---- */
.signin{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.signin form{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:30px 26px;box-shadow:var(--shadow-card)}
.signin img{height:26px;margin-bottom:22px}
.signin h1{font-size:1.9rem;margin:6px 0 8px}
.signin p{margin:0 0 20px;color:var(--text-muted);font-size:.9rem}
.signin input{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:12px 14px;font:inherit;color:var(--text);margin-bottom:12px}
.signin .btn{width:100%;justify-content:center;padding:12px}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em;margin:0 0 10px}

footer{border-top:1px solid var(--border);padding:22px 0 40px;font-size:.76rem;color:var(--text-muted)}
.srcline{margin-top:34px;font-size:.78rem;color:var(--text-muted)}
.logo .on-dark,.signin .on-dark{display:none}
@media (prefers-color-scheme:dark){.logo .on-light,.signin .on-light{display:none}.logo .on-dark,.signin .on-dark{display:block}}
</style>

    var fmt = new Intl.NumberFormat("en-GB", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    var o = { v: 0 };
    tl.to(o, { v: Math.abs(to), duration: 1.5, ease: "power2.out", onUpdate: function () { el.textContent = prefix + fmt.format(o.v); }, onComplete: function () { el.innerHTML = final; } }, at);
  }
  function heroMoment(tl) {
    var seats = gsap.utils.toArray("#hero .seat");
    if (!seats.length) return;
    // Seats rise out of the stage, front row first; the paid ones then light.
    tl.from(seats, { scale: 0, autoAlpha: 0, y: -10, duration: 0.55, ease: "power2.out", stagger: { each: 0.009, from: "start" } }, 0.15);
    var lit = gsap.utils.toArray("#hero .s-sold, #hero .s-pending, #hero .s-losing");
    if (lit.length) tl.fromTo(lit, { scale: 1 }, { scale: 1.35, duration: 0.18, yoyo: true, repeat: 1, ease: "power1.inOut", stagger: 0.05 }, ">-0.1");
  }

  /* ================================================================ EVENTS */
  function bind() {
    document.querySelectorAll("#app [data-open]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); openConv(el.getAttribute("data-open")); });
      el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openConv(el.getAttribute("data-open")); } });
    });
    document.querySelectorAll("#app [data-open] a").forEach(function (a) { a.addEventListener("click", function (e) { e.stopPropagation(); }); });
    document.querySelectorAll("#app [data-tab]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); go(a.getAttribute("data-tab")); }); });
    document.querySelectorAll("#app [data-filter]").forEach(function (b) { b.addEventListener("click", function () { S.filter = b.getAttribute("data-filter"); S.show = 12; rerender(); }); });
    document.querySelectorAll("#app [data-brief]").forEach(function (b) { b.addEventListener("click", function () { S.briefDays = b.getAttribute("data-brief"); rerender(); }); });
    var q = $("q");
    if (q) q.addEventListener("input", function () {
      S.q = q.value;
      clearTimeout(q._t);
      q._t = setTimeout(function () { var pos = q.selectionStart; rerender(); var nq = $("q"); nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (e) {} }, 180);
    });
    var more = $("more");
    if (more) more.addEventListener("click", function () { S.show += 20; rerender(); });
    var rb = $("rebrief");
    if (rb) rb.addEventListener("click", rewriteBrief);
  }
  function rerender() { var y = window.scrollY; renderTab(); window.scrollTo(0, y); }

  // Hover tooltips for every chart mark, from one shared element. Locked charts carry none.
  document.addEventListener("pointermove", function (e) {
    var el = e.target.closest && e.target.closest("[data-tip]"), tip = $("tip");
    if (!el || !el.getAttribute("data-tip")) { tip.classList.remove("on"); return; }
    tip.textContent = el.getAttribute("data-tip");
    tip.style.left = Math.min(window.innerWidth - 80, Math.max(80, e.clientX)) + "px";
    tip.style.top = e.clientY + "px";
    tip.classList.add("on");
  });

  document.querySelectorAll("[data-range]").forEach(function (b) {
    b.addEventListener("click", function () {
      S.range = Number(b.getAttribute("data-range"));
      document.querySelectorAll("[data-range]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      store("apl_ceo_range", String(S.range));
      if (S.data) rerender();
    });
  });

  /* ------------------------------------------------------------ transcript */
  function openConv(id) {
    var dlg = $("drawer"), body = $("drawer-body");
    $("drawer-meta").textContent = "";
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    if (S.data.locked || S.data.samples.aiden) {
      $("drawer-title").textContent = "Sample conversation";
      body.innerHTML = '<p class="muted">This is sample data, so there is no real conversation to read.' + (S.data.locked ? " Switch on the CEO Dashboard to read your own." : "") + "</p>";
      return;
    }
    body.innerHTML = '<p class="muted"><span class="spin"></span> Loading…</p>';
    api("/conversation/" + encodeURIComponent(id)).then(function (r) {
      var c = r.conv || {};
      $("drawer-title").textContent = c.phone || c.email || (c.industry ? c.industry : "Visitor");
      $("drawer-meta").innerHTML = esc([langName(c.lang), c.country, c.industry, fmtWhen(c.start)].filter(Boolean).join(" · ")) + '<div class="contact" style="margin-top:8px">' + contactChips(c.email, c.phone) + (c.reasons || []).map(function (x) { return '<span class="chip why">' + esc(x) + "</span>"; }).join("") + "</div>";
      var lastPage = "", out = "";
      r.turns.forEach(function (tn) {
        if (tn.page !== lastPage) { out += '<div class="msg-time">' + esc(fmtWhen(tn.t)) + " · " + esc(tn.pageTitle || shortPath(tn.page)) + "</div>"; lastPage = tn.page; }
        if (tn.user) out += '<div class="msg v" dir="auto">' + esc(tn.user) + "</div>";
        if (tn.reply) out += '<div class="msg a" dir="auto">' + esc(tn.reply) + "</div>";
      });
      body.innerHTML = out || '<p class="muted">Empty conversation.</p>';
      if (window.gsap && !reduced()) gsap.from(body.children, { autoAlpha: 0, y: 8, duration: 0.4, stagger: { amount: 0.3 }, ease: "power3.out" });
    }).catch(function (e) { body.innerHTML = '<p class="err">' + esc(e.message) + "</p>"; });
  }
  $("drawer-close").addEventListener("click", function () { $("drawer").close(); });
  $("drawer").addEventListener("click", function (e) { if (e.target === $("drawer")) $("drawer").close(); });

  /* ------------------------------------------------------------------- API */
  function api(path, opts) {
    opts = opts || {};
    return fetch(API + path, {
      method: opts.method || "GET",
      headers: Object.assign({ "Content-Type": "application/json" }, S.token ? { Authorization: "Bearer " + S.token } : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      cache: "no-store",
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (j) {
        if (res.status === 401 && path !== "/login") { signOut(); throw new Error("Signed out"); }
        if (!res.ok || j.ok === false) throw new Error(j.error === "locked" ? "Too many tries. Wait " + j.retryInMin + " minutes." : j.error === "wrong_password" ? "That password is not right." : j.error === "preview" ? "Not available in the preview." : j.error || "The dashboard service did not answer (" + res.status + ").");
        return j;
      });
    });
  }
  function load(quiet) {
    if (S.busy) return Promise.resolve();
    S.busy = true;
    if (!S.data && !quiet) $("app").innerHTML = '<p class="muted" style="padding:40px 0"><span class="spin"></span> Reading your data…</p>';
    return api("/data" + (S.preview ? "?preview=1" : "")).then(function (d) {
      var firstLoad = !S.data;
      S.data = d;
      if (firstLoad) render();
      else { renderLockbar(); renderRail(); rerender(); $("updated").textContent = "Updated " + ago(d.now); }
    }).catch(function (e) {
      if (!S.data) $("app").innerHTML = '<div class="offline" style="margin-top:30px"><div><b>Could not reach the dashboard service.</b><br>' + esc(e.message) + "</div></div>";
    }).then(function () { S.busy = false; });
  }
  function rewriteBrief() {
    var b = $("rebrief");
    b.disabled = true;
    b.innerHTML = '<span class="spin"></span> Writing…';
    api("/summary", { method: "POST", body: { days: Number(S.briefDays) } }).then(function (r) {
      if (r.summary) { S.data.summaries = S.data.summaries || {}; S.data.summaries[S.briefDays] = r.summary; }
      rerender();
    }).catch(function (e) { b.disabled = false; b.textContent = "Try again"; alert(e.message); });
  }
  $("refresh").addEventListener("click", function () {
    var b = $("refresh");
    b.disabled = true;
    b.innerHTML = '<span class="spin"></span> Reading';
    api("/refresh", { method: "POST" }).then(function () { return load(true); }).catch(function () {}).then(function () { b.disabled = false; b.textContent = "Refresh"; });
  });
  function signOut() {
    S.token = ""; S.data = null; S.heroDone = false; S.railFirst = true;
    store(TOKEN_KEY, null);
    $("shell").hidden = true;
    $("signin").hidden = false;
    $("pw").focus();
  }
  $("signout").addEventListener("click", signOut);
  $("signin-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("signin-btn");
    btn.disabled = true;
    $("signin-err").textContent = "";
    api("/login", { method: "POST", body: { password: $("pw").value } }).then(function (r) {
      S.token = r.token;
      store(TOKEN_KEY, r.token);
      $("pw").value = "";
      start();
    }).catch(function (err) { $("signin-err").textContent = err.message; }).then(function () { btn.disabled = false; });
  });
  function start() {
    $("signin").hidden = true;
    $("shell").hidden = false;
    setBarH();
    load();
  }

  // Refresh the view every five minutes while the tab is open, and on return to it.
  setInterval(function () { if (S.token && !document.hidden) load(true); }, 5 * 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.token && S.data && Date.now() - S.data.now > 5 * 60000) load(true); });
  setInterval(function () { if (S.data) $("updated").textContent = "Updated " + ago(S.data.now); }, 30000);

  readURL();
  var savedRange = Number(store("apl_ceo_range"));
  if (savedRange === 7 || savedRange === 28) {
    S.range = savedRange;
    document.querySelectorAll("[data-range]").forEach(function (x) { x.setAttribute("aria-pressed", String(Number(x.getAttribute("data-range")) === savedRange)); });
  }
  S.token = store(TOKEN_KEY) || "";
  if (S.token) start(); else { $("signin").hidden = false; }
})();
</script>
</body>
</html>
