name: Autonomous Daily Article Publisher

on:
  schedule:
    # Runs everyday at 19:40 UTC
    - cron: '40 19 * * *'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Daily Article Generation & Publishing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_ROOT: ${{ secrets.FTP_REMOTE_ROOT }}
        run: |
          python3 execution/daily_publish.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "AI Profit Lab Bot"
          git config --global user.email "bot@aiprofitlab.io"
          git add public_html/ directives/article_queue.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-publish daily article [skip ci]"
            git push
          fi
