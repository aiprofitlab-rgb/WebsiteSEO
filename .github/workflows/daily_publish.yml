name: Autonomous Daily Article Publisher

# FALLBACK since 2026-10-16. The daily article is written by Google Antigravity on Nahid's
# Mac (Website SEO/execution/agent_publish.py, started hourly by Antigravity's scheduler).
# This workflow runs once in the evening and publishes only if the Mac published nothing
# that day. It writes with the Gemini API (free tier, GEMINI_API_KEY) and ships a
# placeholder hero, listed in directives/pending_heroes.json; Antigravity's next run
# generates the real image and swaps it in. It never rebuilds `Repair` rows: that is
# Antigravity's job too.
#
# Order matters: generate + validate -> commit -> deploy -> check the live pages. The
# deploy has to come AFTER the commit, because it uploads what changed between the
# server's last deployed commit and HEAD. Any failed step fails the run, and GitHub emails
# you; a run that fails before the commit publishes nothing.

on:
  schedule:
    # 16:17 UTC = 20:17 in Muscat, after the Mac's window for starting the day's article
    # (06:00-19:00 Muscat). GitHub has started these runs up to 5 hours late, so the
    # article's date is taken 6 hours back (PUBLISH_DATE_LAG_HOURS): a run that starts
    # after Muscat midnight still publishes the day it was meant for.
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      repair:
        description: 'Regenerate an existing article in place (paste its slug). Leave empty to publish the next queued topic.'
        required: false
        default: ''
      force:
        description: 'Publish even if an article already went out today'
        type: boolean
        default: false

# One deploy at a time, shared with deploy.yml: two overlapping FTP syncs once
# rolled the live site back.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: ✍️ Generate & Publish Daily Article
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        id: deps
        run: |
          python3 -m pip install --quiet Pillow certifi
          echo "day=$(TZ=Asia/Muscat date +%F)" >> "$GITHUB_OUTPUT"

      # Drafts that already passed, carried between today's slots, so a retry
      # resumes instead of paying for the text and image again.
      - name: ♻️ Restore today's draft cache
        uses: actions/cache@v4
        with:
          path: Website SEO/.tmp/daily_publish
          key: publish-${{ steps.deps.outputs.day }}-${{ github.run_id }}
          restore-keys: publish-${{ steps.deps.outputs.day }}-

      - name: 🔑 Preflight (API key, models, skill)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_PROVIDERS: placeholder
        run: |
          cd "Website SEO"
          python3 execution/daily_publish.py --preflight

      - name: ✍️ Generate, render and validate
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_PROVIDERS: placeholder
          PUBLISH_DATE_LAG_HOURS: ${{ github.event_name == 'schedule' && '6' || '0' }}
          REPAIR: ${{ inputs.repair }}
          FORCE: ${{ inputs.force }}
        run: |
          cd "Website SEO"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          args=(--no-repair)
          if [ -n "$REPAIR" ]; then args=(--repair "$REPAIR"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 execution/daily_publish.py "${args[@]}"

      - name: 💾 Commit & Push
        id: push
        if: steps.gen.outputs.published == 'true'
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
          KIND: ${{ steps.gen.outputs.kind }}
        run: |
          git config user.name "AI Profit Lab Bot"
          git config user.email "bot@aiprofitlab.io"
          # Antigravity may have published while this run was writing. Then this draft is
          # dropped rather than putting two articles on one day.
          day="${SLUG:0:10}"
          git fetch --quiet origin main
          if [ "$KIND" = "Publish" ] && git ls-tree --name-only origin/main "Website SEO/public_html/blog/en/" \
               | grep "/$day-" | grep -qv "/$SLUG.html"; then
            echo "::notice::Antigravity published an article for $day meanwhile; dropping this draft."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A "Website SEO/public_html" "Website SEO/directives"
          git commit -m "${KIND:-Publish} article: $SLUG (GitHub fallback, placeholder hero)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: 🚀 Deploy to Hostinger
        if: steps.push.outputs.pushed == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 "Website SEO/tools/deploy_ftp.py" --base "${{ steps.gen.outputs.base_sha }}"

      - name: 🔎 Verify the article is live
        if: steps.push.outputs.pushed == 'true'
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          cd "Website SEO"
          python3 execution/daily_publish.py --verify "$SLUG"
