name: Autonomous Daily Article Publisher

on:
  schedule:
    # Runs everyday at 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

jobs:
  publish:
    name: ✍️ Generate & Publish Daily Article
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Run Daily Article Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd "Website SEO"
          python3 execution/daily_publish.py

      - name: 💾 Commit & Push Changes
        run: |
          git config --global user.name "AI Profit Lab Bot"
          git config --global user.email "bot@aiprofitlab.io"
          git add "Website SEO/"
          if git diff --staged --quiet; then
            echo "No new article changes to commit."
          else
            git commit -m "Auto-publish daily article [skip ci]"
            git push origin main
          fi
