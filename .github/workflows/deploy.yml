name: Deploy to Hostinger
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Shared with daily_publish.yml so two FTP syncs never overlap.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # deploy_ftp.py uploads everything changed since the server's last
      # successful deploy; github.event.before is only the fallback for the very
      # first run, before the server has a marker.
      - name: 🚀 Sync Website to Hostinger FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_ROOT: "./"
        run: |
          python3 "Website SEO/tools/deploy_ftp.py" --base "${{ github.event.before }}"
